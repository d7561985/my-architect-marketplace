name: Traceability regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: node --test plugins/my-architect/tests/traceability.test.mjs
